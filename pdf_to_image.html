<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 高解析圖片匯出</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d8dee6;
  --accent:#2563eb;--accent-hover:#1d4ed8;--ok:#15803d;--error:#b91c1c;
  --soft:#eff6ff;--soft-border:#93c5fd;--thumb-size:170px
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px}
.app{width:min(1240px,100%);margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
h1{margin:0 0 18px;font-size:28px}
.dropzone{border:2px dashed #b8c2cf;border-radius:16px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:28px;background:#fafbfc}
.dropzone.dragover{border-color:var(--accent);background:#eff6ff}
.drop-title{font-size:22px;font-weight:700;margin-bottom:8px}
.drop-desc{color:var(--muted);font-size:14px}
.controls{margin-top:20px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px}
.action-row{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
select,button,input[type="range"]{min-height:44px;border-radius:10px;font-size:15px}
select{width:100%;border:1px solid var(--border);background:#fff;padding:0 12px}
button{border:1px solid var(--border);background:#fff;padding:0 14px;cursor:pointer}
.primary{border:0;background:var(--accent);color:#fff;font-weight:700}
.primary:hover{background:var(--accent-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
.zoom-box{border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:#fff}
.zoom-row{display:flex;align-items:center;gap:12px}
.zoom-row input[type="range"]{width:100%;min-height:auto}
.zoom-value{min-width:54px;text-align:right;font-weight:700}
.status{margin-top:16px;min-height:24px;font-size:14px;color:var(--muted);white-space:pre-line}
.status.ok{color:var(--ok)}.status.error{color:var(--error)}
.progress-wrap{margin-top:14px;background:#e5e7eb;border-radius:999px;height:10px;overflow:hidden;display:none}
.progress{width:0;height:100%;background:var(--accent)}
.summary{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:14px}
.summary strong{color:var(--text)}
.docs{margin-top:20px;display:grid;gap:18px}
.doc-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
.doc-head{padding:14px 16px;border-bottom:1px solid #edf0f3;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.doc-title{font-weight:700}
.doc-meta{color:var(--muted);font-size:13px;margin-top:4px}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px}
.doc-actions button{min-height:36px;font-size:14px}
.thumb-wrap{padding:16px}
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb-size),1fr));gap:14px;align-items:start}
.thumb{border:2px solid var(--border);border-radius:12px;padding:8px;cursor:pointer;background:#fff;transition:.15s;user-select:none;position:relative}
.thumb:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.thumb.selected{border-color:var(--soft-border);background:var(--soft)}
.thumb.expanded{grid-column:1/-1;cursor:zoom-out;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:12px}
.thumb img{width:100%;display:block;border:1px solid #e5e7eb;border-radius:8px;background:#fff}
.thumb.expanded img{width:auto;max-width:100%;max-height:80vh;margin:0 auto}
.thumb-label{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.badge{font-size:12px;border-radius:999px;padding:2px 8px;background:#e5e7eb;color:#374151}
.thumb.selected .badge{background:#dbeafe;color:#1d4ed8}
.loading{padding:18px 16px;color:var(--muted);font-size:14px}
@media(max-width:850px){.controls{grid-template-columns:1fr}.app{padding:20px}}
@media(max-width:640px){:root{--thumb-size:140px}}
</style>
</head>
<body>
<div class="app">
  <h1>PDF 高解析圖片匯出</h1>

  <div id="dropzone" class="dropzone">
    <div>
      <div class="drop-title">將 PDF 拖曳到這裡</div>
      <div class="drop-desc">或點擊選擇 PDF</div>
    </div>
  </div>
  <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>

  <div class="controls">
    <div>
      <label for="dpi">輸出解析度</label>
      <select id="dpi">
        <option value="150">150 DPI</option>
        <option value="300" selected>300 DPI</option>
        <option value="400">400 DPI</option>
        <option value="600">600 DPI</option>
      </select>
    </div>
    <div>
      <label for="format">輸出格式</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg" selected>JPG</option>
      </select>
    </div>
    <div class="zoom-box">
      <label for="thumbSize">預覽大小</label>
      <div class="zoom-row">
        <input id="thumbSize" type="range" min="110" max="280" step="10" value="170">
        <div id="thumbSizeValue" class="zoom-value">170</div>
      </div>
    </div>
  </div>


  <div style="margin-top:14px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fafbfc;color:#4b5563;font-size:13px;line-height:1.7">
    <strong style="color:#1f2937">操作說明：</strong>
    單擊頁面可切換選取；Shift + 單擊可連續選取或取消；雙擊頁面可開啟清晰預覽，再次雙擊即可收合。
    可使用「預覽大小」調整縮圖尺寸，選取完成後按「匯出已選頁面」。
  </div>

  <div class="action-row">
    <button id="folderBtn">選擇輸出資料夾</button>
    <button id="selectAllBtn">全選全部頁面</button>
    <button id="clearAllBtn">清除全部選取</button>
    <button id="exportBtn" class="primary" disabled>匯出已選頁面</button>
  </div>

  <div id="progressWrap" class="progress-wrap"><div id="progress" class="progress"></div></div>
  <div id="status" class="status">尚未載入 PDF。</div>

  <div class="summary">
    <div>PDF 數量：<strong id="docCount">0</strong></div>
    <div>總頁數：<strong id="pageCount">0</strong></div>
    <div>已選頁數：<strong id="selectedCount">0</strong></div>
  </div>

  <div id="docs" class="docs"></div>
</div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const $=id=>document.getElementById(id);
const dropzone=$("dropzone"),fileInput=$("fileInput"),dpiSelect=$("dpi"),formatSelect=$("format");
const folderBtn=$("folderBtn"),selectAllBtn=$("selectAllBtn"),clearAllBtn=$("clearAllBtn"),exportBtn=$("exportBtn");
const statusEl=$("status"),progressWrap=$("progressWrap"),progressEl=$("progress"),docsEl=$("docs");
const docCountEl=$("docCount"),pageCountEl=$("pageCount"),selectedCountEl=$("selectedCount");
const thumbSizeInput=$("thumbSize"),thumbSizeValue=$("thumbSizeValue");
const docs=[];let outputDirHandle=null,lastAnchor=null;
const root=document.documentElement;

function setStatus(t,c=""){statusEl.textContent=t;statusEl.className="status"+(c?" "+c:"")}
function safeBaseName(n){return n.replace(/\.pdf$/i,"").replace(/[\\/:*?"<>|]/g,"_")}
function setThumbSize(v){
  v=Math.max(110,Math.min(280,Number(v)));
  root.style.setProperty("--thumb-size",v+"px");
  thumbSizeInput.value=v;thumbSizeValue.textContent=v
}
thumbSizeInput.addEventListener("input",e=>setThumbSize(e.target.value));setThumbSize(170);

function updateSummary(){
  const dc=docs.length,tp=docs.reduce((s,d)=>s+d.pages.length,0),sp=docs.reduce((s,d)=>s+d.pages.filter(p=>p.selected).length,0);
  docCountEl.textContent=dc;pageCountEl.textContent=tp;selectedCountEl.textContent=sp;
  exportBtn.disabled=!sp;exportBtn.textContent=sp?`匯出已選頁面（${sp}）`:"匯出已選頁面"
}
function updateDocMeta(d){if(d.metaSelectedEl)d.metaSelectedEl.textContent=`共 ${d.pages.length} 頁，已選 ${d.pages.filter(p=>p.selected).length} 頁`}
function setPageSelected(p,s,a=false){
  p.selected=s;p.tileEl.classList.toggle("selected",s);p.badgeEl.textContent=s?"已選取":"未選";
  updateDocMeta(p.doc);updateSummary();if(a)lastAnchor={docKey:p.doc.key,index:p.index}
}
function togglePage(p){setPageSelected(p,!p.selected,true)}
function shiftToggleRange(p){
  if(!lastAnchor||lastAnchor.docKey!==p.doc.key){togglePage(p);return}
  const a=Math.min(lastAnchor.index,p.index),b=Math.max(lastAnchor.index,p.index),state=!p.selected;
  for(let i=a;i<=b;i++)setPageSelected(p.doc.pages[i],state,false);
  lastAnchor={docKey:p.doc.key,index:p.index}
}
function setDocSelected(d,s){d.pages.forEach((p)=>setPageSelected(p,s,false));if(d.pages.length)lastAnchor={docKey:d.key,index:d.pages.length-1}}
function makeButton(t,f){const b=document.createElement("button");b.type="button";b.textContent=t;b.addEventListener("click",f);return b}

async function renderPageDataUrl(page,scale,quality=.85){
  const vp=page.getViewport({scale}),c=document.createElement("canvas"),ctx=c.getContext("2d",{alpha:false});
  c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const url=c.toDataURL("image/jpeg",quality);c.width=1;c.height=1;return url
}

async function expandPage(p){
  if(p.tileEl.classList.contains("expanded")){
    p.tileEl.classList.remove("expanded");
    p.imgEl.src=p.thumbUrl;
    return
  }
  p.doc.pages.forEach(x=>{
    if(x!==p&&x.tileEl.classList.contains("expanded")){
      x.tileEl.classList.remove("expanded");
      x.imgEl.src=x.thumbUrl
    }
  });
  p.tileEl.classList.add("expanded");
  if(p.detailUrl){
    p.imgEl.src=p.detailUrl;
    p.tileEl.scrollIntoView({behavior:"smooth",block:"nearest"});
    return
  }
  setStatus(`正在建立第 ${p.pageNumber} 頁預覽...`);
  try{
    const page=await p.doc.pdf.getPage(p.pageNumber);
    p.detailUrl=await renderPageDataUrl(page,2.0,.9);
    p.imgEl.src=p.detailUrl;
    p.tileEl.scrollIntoView({behavior:"smooth",block:"nearest"});
    setStatus(`第 ${p.pageNumber} 頁預覽已載入。`,"ok")
  }catch(err){
    setStatus("預覽建立失敗："+(err?.message||err),"error")
  }
}

function attachThumbEvents(tile,p){
  let timer=null;
  tile.addEventListener("click",e=>{
    if(timer)clearTimeout(timer);
    timer=setTimeout(()=>{e.shiftKey?shiftToggleRange(p):togglePage(p);timer=null},230)
  });
  tile.addEventListener("dblclick",e=>{
    e.preventDefault();e.stopPropagation();
    if(timer){clearTimeout(timer);timer=null}
    expandPage(p)
  })
}

async function addFiles(fileList){
  const incoming=[...fileList].filter(f=>f.type==="application/pdf"||f.name.toLowerCase().endsWith(".pdf"));
  if(!incoming.length){setStatus("未偵測到 PDF 檔案。","error");return}
  const keys=new Set(docs.map(d=>d.key));
  for(const file of incoming){
    const key=`${file.name}|${file.size}|${file.lastModified}`;
    if(keys.has(key))continue;keys.add(key);

    const card=document.createElement("div");card.className="doc-card";
    const head=document.createElement("div");head.className="doc-head";
    const left=document.createElement("div"),title=document.createElement("div"),meta=document.createElement("div");
    title.className="doc-title";title.textContent=file.name;meta.className="doc-meta";meta.textContent="載入中...";
    left.append(title,meta);
    const actions=document.createElement("div");actions.className="doc-actions";head.append(left,actions);card.appendChild(head);
    const wrap=document.createElement("div");wrap.className="thumb-wrap";
    const loading=document.createElement("div");loading.className="loading";loading.textContent="正在建立縮圖預覽...";
    wrap.appendChild(loading);card.appendChild(wrap);docsEl.appendChild(card);

    const doc={key,file,pdf:null,pages:[],cardEl:card,metaSelectedEl:meta};docs.push(doc);updateSummary();

    try{
      const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise;doc.pdf=pdf;
      actions.append(
        makeButton("全選本檔",()=>setDocSelected(doc,true)),
        makeButton("清除本檔",()=>setDocSelected(doc,false)),
        makeButton("移除本檔",()=>{
          const i=docs.indexOf(doc);if(i>=0)docs.splice(i,1);card.remove();
          if(lastAnchor?.docKey===doc.key)lastAnchor=null;updateSummary()
        })
      );
      const grid=document.createElement("div");grid.className="thumb-grid";wrap.replaceChild(grid,loading);
      grid.addEventListener("wheel",e=>{
        if(!(e.ctrlKey||e.altKey))return;e.preventDefault();
        setThumbSize(Number(thumbSizeInput.value)+(e.deltaY<0?10:-10))
      },{passive:false});

      for(let n=1;n<=pdf.numPages;n++){
        meta.textContent=`共 ${pdf.numPages} 頁，正在建立第 ${n} 頁縮圖...`;
        const page=await pdf.getPage(n),thumbUrl=await renderPageDataUrl(page,.24,.78);

        const tile=document.createElement("div");tile.className="thumb selected";
        const img=document.createElement("img");img.src=thumbUrl;img.alt=`第 ${n} 頁`;
        const label=document.createElement("div");label.className="thumb-label";
        const txt=document.createElement("span");txt.textContent=`第 ${n} 頁`;
        const badge=document.createElement("span");badge.className="badge";badge.textContent="已選取";
        label.append(txt,badge);
        tile.append(img,label);grid.appendChild(tile);

        const p={doc,index:n-1,pageNumber:n,selected:true,tileEl:tile,badgeEl:badge,imgEl:img,thumbUrl,detailUrl:null};
        doc.pages.push(p);attachThumbEvents(tile,p);updateDocMeta(doc);updateSummary();
        await new Promise(r=>setTimeout(r,0))
      }
      updateDocMeta(doc);setStatus(`已載入 ${file.name}。`,"ok")
    }catch(err){
      meta.textContent="載入失敗";loading.textContent="此 PDF 無法讀取。";loading.style.color="#b91c1c";
      setStatus(`載入失敗：${file.name}，${err.message||err}`,"error")
    }
  }
}

dropzone.addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",e=>addFiles(e.target.files));
["dragenter","dragover"].forEach(x=>dropzone.addEventListener(x,e=>{e.preventDefault();dropzone.classList.add("dragover")}));
["dragleave","drop"].forEach(x=>dropzone.addEventListener(x,e=>{e.preventDefault();dropzone.classList.remove("dragover")}));
dropzone.addEventListener("drop",e=>addFiles(e.dataTransfer.files));

folderBtn.addEventListener("click",async()=>{
  if(!window.showDirectoryPicker){setStatus("目前瀏覽器不支援直接選擇輸出資料夾，將改用一般下載方式。","error");return}
  try{outputDirHandle=await window.showDirectoryPicker({mode:"readwrite"});folderBtn.textContent=`輸出資料夾：${outputDirHandle.name}`;setStatus("已選擇輸出資料夾。","ok")}
  catch(err){if(err.name!=="AbortError")setStatus("選擇輸出資料夾失敗："+err.message,"error")}
});
selectAllBtn.addEventListener("click",()=>{docs.forEach(d=>setDocSelected(d,true));setStatus("已全選全部頁面。","ok")});
clearAllBtn.addEventListener("click",()=>{docs.forEach(d=>setDocSelected(d,false));setStatus("已清除全部選取。","ok")});

async function canvasToBlob(c,f){
  const mime=f==="jpeg"?"image/jpeg":"image/png",q=f==="jpeg"?.95:undefined;
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("圖片轉換失敗")),mime,q))
}
async function saveBlob(blob,name){
  if(outputDirHandle){
    const h=await outputDirHandle.getFileHandle(name,{create:true}),w=await h.createWritable();await w.write(blob);await w.close();return
  }
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)
}

exportBtn.addEventListener("click",async()=>{
  const jobs=[];for(const d of docs)for(const p of d.pages)if(p.selected)jobs.push({doc:d,pageNumber:p.pageNumber});
  if(!jobs.length){setStatus("請先選取至少一頁。","error");return}
  exportBtn.disabled=folderBtn.disabled=selectAllBtn.disabled=clearAllBtn.disabled=true;progressWrap.style.display="block";progressEl.style.width="0";
  try{
    const dpi=Number(dpiSelect.value),format=formatSelect.value,ext=format==="jpeg"?"jpg":"png",scale=dpi/72;
    for(let i=0;i<jobs.length;i++){
      const j=jobs[i],page=await j.doc.pdf.getPage(j.pageNumber),vp=page.getViewport({scale}),c=document.createElement("canvas"),ctx=c.getContext("2d",{alpha:false});
      c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
      if(format==="jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height)}
      setStatus(`正在匯出：${j.doc.file.name}\n第 ${j.pageNumber} 頁（${i+1} / ${jobs.length}）`);
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      const blob=await canvasToBlob(c,format),digits=Math.max(3,String(j.doc.pdf.numPages).length),num=String(j.pageNumber).padStart(digits,"0");
      await saveBlob(blob,`${safeBaseName(j.doc.file.name)}_${num}.${ext}`);
      c.width=1;c.height=1;progressEl.style.width=`${Math.round((i+1)/jobs.length*100)}%`
    }
    setStatus(`完成，共輸出 ${jobs.length} 張圖片。`,"ok")
  }catch(err){setStatus("處理失敗："+(err?.message||err),"error")}
  finally{folderBtn.disabled=selectAllBtn.disabled=clearAllBtn.disabled=false;updateSummary()}
});
updateSummary();
</script>
</body>
</html>
