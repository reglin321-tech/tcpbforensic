<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鑑識工具箱</title>
<style>
:root{
  --bg:#ffffff;
  --soft:#f5f6f7;
  --soft-hover:#e9edf1;
  --line:#e2e5e8;
  --text:#343a40;
  --muted:#737b84;
  --bar:#575757;
  --bar-active:#43566b;
  --blue:#4c65c8;
  --orange:#ee6b39;
  --green:#47a957;
  --gold:#d5a21a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column;min-width:0}

/* 頁首：刻意保持單純 */
.site-head{background:#fff;border-bottom:1px solid #e6e6e6}
.top-visual{
  width:100%;
  aspect-ratio:1898 / 176;
  min-height:110px;
  max-height:180px;
  background-color:#f8fbff;
  background-image: url("image/top.png");
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
}

.topbar{height:48px;background:var(--bar)}
.topbar-inner{max-width:1584px;height:100%;margin:auto;display:flex;align-items:stretch;padding:0 24px}
.topbar-item{display:flex;align-items:center;padding:0 28px;color:#fff;text-decoration:none;font-size:22px;background:transparent;font-weight:700;border-bottom:4px solid #9fb7cf}


.topbar-item:hover{background:rgba(255,255,255,.08)}

#workspace{flex:1;min-height:0;position:relative}
#dashboard{height:100%;overflow:auto;padding:34px 24px 48px}
.container{max-width:1584px;margin:auto}
.intro{text-align:center;margin:0 auto 32px;max-width:940px;font-size:21px;line-height:1.8;color:#555}

.section{margin-bottom:32px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px;padding:0 2px}
.section-title{font-size:30px;font-weight:700;color:#333}
.section-note{font-size:18px;color:var(--muted)}

.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(264px,1fr));gap:14px}
.quick-btn,.category-btn{border:0;background:#efefef;color:#4a4a4a;border-radius:14px;cursor:pointer;transition:.12s;font-family:inherit}
.quick-btn{position:relative;min-height:82px;padding:18px 34px;font-size:23px;font-weight:600;text-align:center;border:1px solid #e8e8e8}
.quick-btn:hover,.category-btn:hover{background:#e4e7ea;color:#222}
.star{position:absolute;right:11px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:23px;color:#b6b6b6;cursor:pointer;padding:2px 4px}
.quick-btn .star{opacity:0;transition:opacity .15s}
.quick-btn:hover .star,.quick-btn .star:focus{opacity:1}
.star.on{color:var(--gold);opacity:.5}


.category-grid{display:grid;grid-template-columns:repeat(5,minmax(252px,1fr));gap:18px}
.category{background:#f5f5f5;padding:24px 18px 20px;border-radius:16px;border:1px solid #eeeeee;box-shadow:0 2px 7px rgba(0,0,0,.05)}
.category h3{margin:0 0 18px;text-align:center;font-size:28px;font-weight:700}
.category:nth-child(1) h3{color:var(--orange)}
.category:nth-child(2) h3{color:var(--blue)}
.category:nth-child(3) h3{color:var(--green)}
.category:nth-child(4) h3{color:#8a6bc5}
.category:nth-child(5) h3{color:#777}
.category-list{display:grid;gap:8px}
.category-btn{position:relative;width:100%;min-height:72px;padding:14px 24px;font-size:21px;line-height:1.35;border:1px solid #e3e3e3;background:#e9e9e9}
.category-btn .mini-star{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#aaa;font-size:21px;cursor:pointer;opacity:0;transition:opacity .15s}
.category-btn:hover .mini-star,.category-btn .mini-star:focus,.category-btn .mini-star.on{opacity:1}
.category-btn .mini-star.on{color:var(--gold);opacity:.65}

.empty{grid-column:1/-1;padding:18px;text-align:center;color:#8a8f94;border:1px dashed #d5d8db;background:#fafafa;border-radius:12px;font-size:20px}


/* 響應式：不改變大螢幕五欄設計 */
@media(max-width:1450px){
  .category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:900px){
  .category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-visual{aspect-ratio:auto;height:130px;min-height:0;background-size:cover}
  .section-title{font-size:26px}
}
@media(max-width:600px){
  .top-visual{height:94px;background-size:cover;background-position:center}
  .topbar{height:44px}
  .topbar-inner{padding:0 16px}
  .topbar-item{font-size:17px;padding:0 14px}
  #dashboard{height:auto;overflow:visible;padding:22px 14px 40px}
  .section{margin-bottom:25px}
  .section-head{align-items:center;margin-bottom:11px}
  .section-title{font-size:23px}
  .section-note{font-size:12px}
  .category-grid{grid-template-columns:minmax(0,1fr);gap:13px}
  .quick-grid{grid-template-columns:minmax(0,1fr);gap:9px}
  .category{padding:17px 15px;border-radius:15px}
  .category h3{font-size:23px;margin-bottom:12px}
  .category-list{gap:8px}
  .category-btn{font-size:18px;min-height:54px;padding:11px 42px}
  .quick-btn{font-size:19px;min-height:58px;padding:12px 42px}
  .empty{font-size:16px}
}
/* 觸控裝置沒有 hover，保留可操作的星號 */
@media(hover:none), (pointer:coarse){
  .quick-btn .star{opacity:1}
  .category-btn .mini-star{opacity:.55}
  .category-btn .mini-star.on{opacity:1}
  .star,.category-btn .mini-star{min-width:36px;min-height:40px;display:flex;align-items:center;justify-content:center}
}

</style>
</head>
<body>
<header class="site-head">
  <div class="top-visual" aria-label="鑑識工具箱"></div>
  <nav class="topbar">
    <div class="topbar-inner">
      <a class="topbar-item" href="#" id="topHome">鑑識工具箱</a>
    </div>
  </nav>
</header>


<div id="workspace">
  <main id="dashboard">
    <div class="container">
      

      <section class="section">
        <div class="section-head">
          <div class="section-title">我的最愛</div>
          <div class="section-note">常用功能快速入口</div>
        </div>
        <div class="quick-grid" id="favoriteGrid"></div>
      </section>


      <section class="section">
        <div class="section-head">
          <div class="section-title">全部功能</div>
          <div class="section-note">依用途分類</div>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
      </section>
    </div>
  </main>
</div>

<script>
const tools = [
  {name:'分機查詢', href:'contacts/phonebook.html', category:'行政工作'},
  {name:'時間線', href:'timeline_pic_v12.html', category:'行政工作'},
  {name:'心智圖', href:'card_mindmap_timeline_style.html', category:'行政工作'},

  {name:'裝備檢查', href:'duty/equipment.html', category:'現場勘察'},
  {name:'標籤列印', href:'LABELPRINT/labelprint.html', category:'現場勘察'},
  {name:'360影像標記', href:'360viewer.html', category:'現場勘察'},

  {name:'PDF轉JPG', href:'pdf_to_image_v3.html', category:'文書工具'},
  {name:'JPG彙整為PDF', href:'image_to_pdf.html', category:'文書工具'},
  {name:'PDF回復PPT/PNG', href:'pdf_to_ppt_v4.html', category:'文書工具'},

  {name:'指紋文號添加', href:'FPaddnum/FPaddnum.html', category:'影像處理'},
  {name:'指紋排除工具', href:'fpexclude.html', category:'影像處理'},
  {name:'批次圖片手動剪裁', href:'batch_cropper.html', category:'影像處理'},
  {name:'曲面FP校正', href:'curve FP.html', category:'影像處理'},
  {name:'光譜標記', href:'ramanspec_compare_v2.html', category:'影像處理'},
  {name:'工具痕跡比對', href:'Toolmarkcompare_HTML_v5.html', category:'影像處理'},


  {name:'臺中懶人彙整表', href:'excel_remark_filler.html', category:'其他'}
];

const DEFAULT_FAVORITES = [
  'LABELPRINT/labelprint.html',
  'pdf_to_image.html',
  'Toolmarkcompare_HTML_v5.html',
  'contacts/phonebook.html'
];
const LS_FAV = 'forensicToolbox.favorites';
let favorites = loadArray(LS_FAV, DEFAULT_FAVORITES);

function loadArray(key, fallback){
  try{
    const v = JSON.parse(localStorage.getItem(key));
    return Array.isArray(v) ? v : [...fallback];
  }catch(e){return [...fallback]}
}
function save(){
  localStorage.setItem(LS_FAV, JSON.stringify(favorites));
}
function toolByHref(h){return tools.find(t => t.href === h)}
function toggleFavorite(h){
  favorites = favorites.includes(h) ? favorites.filter(x => x !== h) : [...favorites, h];
  save(); renderAll();
}
function openTool(h){
  const t = toolByHref(h); if(!t) return;
  save();
  window.open(h, '_blank', 'noopener,noreferrer');
}
function renderFavorites(){
  const grid = document.getElementById('favoriteGrid'); grid.innerHTML = '';
  const arr = favorites.map(toolByHref).filter(Boolean);
  if(!arr.length){grid.innerHTML = '<div class="empty">尚未加入常用功能。</div>'; return;}
  arr.forEach(t => {
    const b = document.createElement('button'); b.className = 'quick-btn';
    b.innerHTML = `${t.name}<span class="star on" title="移除最愛">★</span>`;
    b.addEventListener('click', e => {if(e.target.classList.contains('star')) return; openTool(t.href)});
    b.querySelector('.star').addEventListener('click', e => {e.stopPropagation(); toggleFavorite(t.href)});
    grid.appendChild(b);
  });
}
function renderCategories(){
  const labels = {
    '現場勘察':'現場勘察',
    '影像處理':'影像處理',
    '文書工具':'文書工具',
    '行政工作':'行政工作',
    '其他':'其他'
  };
  const grid = document.getElementById('categoryGrid'); grid.innerHTML = '';
  ['現場勘察','影像處理','文書工具','行政工作','其他'].forEach(cat => {
    const box = document.createElement('div'); box.className = 'category';
    box.innerHTML = `<h3>${labels[cat]}</h3><div class="category-list"></div>`;
    const list = box.querySelector('.category-list');
    tools.filter(t => t.category === cat).forEach(t => {
      const b = document.createElement('button'); b.className = 'category-btn';
      b.innerHTML = `<span>${t.name}</span><span class="mini-star ${favorites.includes(t.href)?'on':''}" title="加入/移除最愛">★</span>`;
      b.addEventListener('click', e => {if(e.target.classList.contains('mini-star')) return; openTool(t.href)});
      b.querySelector('.mini-star').addEventListener('click', e => {e.stopPropagation(); toggleFavorite(t.href)});
      list.appendChild(b);
    });
    grid.appendChild(box);
  });
}
function renderAll(){renderFavorites();renderCategories()}

document.getElementById('topHome').onclick = e => { e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); };
renderAll();
</script>
</body>
</html>
