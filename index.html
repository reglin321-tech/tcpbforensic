<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>鑑識工具箱</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        height: 100%;
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background: #f3f5f7;
    }

    body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ===== 上方標頭 ===== */
    #navbar {
        min-height: 64px;
        padding: 10px 18px;

        display: flex;
        align-items: center;
        gap: 8px;

        background: #263746;
        border-bottom: 1px solid #182631;

        overflow-x: auto;
        white-space: nowrap;
    }

    /* 系統名稱 */
    .navbar-title {
        display: flex;
        align-items: center;
        gap: 8px;

        margin-right: 12px;
        padding-right: 18px;

        color: white;
        font-size: 18px;
        font-weight: 700;

        border-right: 1px solid rgba(255,255,255,.25);
        flex-shrink: 0;
    }

    .navbar-title .icon {
        font-size: 22px;
    }

    /* 功能按鈕 */
    #navbar a {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        height: 38px;
        padding: 0 14px;

        color: #e8eef3;
        text-decoration: none;

        font-size: 14px;
        font-weight: 500;

        border-radius: 7px;

        transition:
            background-color .15s ease,
            color .15s ease,
            transform .15s ease;
    }

    /* 滑鼠移入 */
    #navbar a:hover {
        background: rgba(255,255,255,.14);
        color: #ffffff;
    }

    /* 點選中的功能 */
    #navbar a.active {
        background: #ffffff;
        color: #263746;
        font-weight: 700;
        box-shadow: 0 2px 6px rgba(0,0,0,.18);
    }

    /* iframe */
    #content-frame {
        flex: 1;
        width: 100%;
        border: none;
        background: white;
    }

    /* scrollbar */
    #navbar::-webkit-scrollbar {
        height: 5px;
    }

    #navbar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.25);
        border-radius: 10px;
    }
    /* ===== 最近使用的分頁特殊顏色 ===== */
    #navbar a.recent-tab {
        background-color: #385066; /* 稍微亮一點的藍灰色背景 */
        color: #8ab4f8; /* 淺藍色文字 */
        border: 1px dashed rgba(138, 180, 248, 0.4); /* 加上淡淡的虛線邊框增加辨識度 */
    }

    /* 滑鼠移入最近使用的分頁 */
    #navbar a.recent-tab:hover {
        background-color: #4b6a85;
        color: #ffffff;
    }

    /* 當「最近使用的分頁」是被點選的狀態 (active) 時 */
    #navbar a.recent-tab.active {
        background: #8ab4f8; /* 變成亮藍色背景 */
        color: #1a252f;      /* 深色文字 */
        border: none;        /* 移除虛線邊框 */
        font-weight: 700;
    }
</style>

</head>


<body>

<div id="navbar">

    <div class="navbar-title">
        <span class="icon">🧰</span>
        <span>鑑識工具箱</span>
    </div>

    <a href="duty/equipment.html"
       target="contentFrame"
       class="active">
        裝備檢查
    </a>

    <a href="contacts/phonebook.html"
       target="contentFrame">
        分機查詢
    </a>

    <a href="LABELPRINT/labelprint.html"
       target="contentFrame">
        標籤列印
    </a>

    <a href="timeline_pic_v12.html"
       target="contentFrame">
        時間線
    </a>

    <a href="ramanspec_compare_v2.html"
       target="contentFrame">
        光譜標記
    </a>

    <a href="card_mindmap_timeline_style.html"
       target="contentFrame">
        心智圖
    </a>

    <a href="pdf_to_image_v3.html"
       target="contentFrame">
        PDF轉JPG
    </a>

    <a href="image_to_pdf.html"
       target="contentFrame">
        JPG彙整為PDF
    </a>

    <a href="pdf_to_ppt_v4.html"
       target="contentFrame">
        PDF回復PPT/PNG
    </a>
    <a href="batch_cropper.html"
       target="contentFrame">
        批次圖片手動剪裁
    </a>
    <a href="curve FP.html"
       target="contentFrame">
        曲面FP校正
    </a>
    </a>
    <a href="360viewer.html"
       target="contentFrame">
        360影像標記
    </a>
    <a href="Toolmarkcompare_HTML_v5.html"
       target="contentFrame">
        工具痕跡比對
    </a>
</div>
<iframe
    id="content-frame"
    name="contentFrame"
    src="duty/equipment.html">
</iframe>
<script>
    const navbar = document.getElementById("navbar");
    const titleElement = document.querySelector(".navbar-title");
    const navLinks = document.querySelectorAll("#navbar a");

    // 建立一個分隔線元素，用來區分「最近使用」與「全部功能」
    const separator = document.createElement("div");
    separator.style.width = "1px";
    separator.style.height = "24px";
    separator.style.backgroundColor = "rgba(255,255,255,0.25)";
    separator.style.margin = "0 8px";
    navbar.insertBefore(separator, titleElement.nextSibling);

    // 用陣列來記錄最近使用的功能標籤 (最多 3 個)
    let recentTabs = [];

    // 負責更新「最近使用」區塊的函數
    function updateRecentTabs(clickedLink) {
        const originalHref = clickedLink.getAttribute("href");
        const originalLink = Array.from(navLinks).find(link => link.getAttribute("href") === originalHref);

        // 1. 移除陣列中已存在的同名項目 (避免重複)
        recentTabs = recentTabs.filter(tab => tab.getAttribute("href") !== originalHref);

        // 2. 將最新點擊的加入陣列開頭
        recentTabs.unshift(originalLink);

        // 3. 確保最多只有 3 個
        if (recentTabs.length > 3) {
            recentTabs.pop();
        }

        // 4. 清除目前標題右側到分隔線之間的所有「複製按鈕」
        let nextEl = titleElement.nextSibling;
        while (nextEl && nextEl !== separator) {
            let toRemove = nextEl;
            nextEl = nextEl.nextSibling;
            navbar.removeChild(toRemove);
        }

        // 5. 將陣列中的按鈕複製並插入到標題右側
        [...recentTabs].reverse().forEach(tab => {
            const clone = tab.cloneNode(true);
            clone.classList.remove("active"); // 複製時先移除 active

            // 🔥 新增這一行：為複製出來的按鈕加上特殊顏色的 class
            clone.classList.add("recent-tab");

            clone.addEventListener("click", function(e) {
                e.preventDefault();

                document.getElementById("content-frame").src = this.getAttribute("href");

                navLinks.forEach(item => item.classList.remove("active"));
                originalLink.classList.add("active");

                updateRecentTabs(this);
            });

            navbar.insertBefore(clone, titleElement.nextSibling);
        });

        // 確保目前的 clone 按鈕有正確的 active 狀態
        let currentClones = document.querySelectorAll("#navbar a.recent-tab");
        currentClones.forEach(c => {
            if (c.getAttribute("href") === originalHref) {
                c.classList.add("active");
            }
        });
    }

    // 為原始列表綁定點擊事件
    navLinks.forEach(link => {
        link.addEventListener("click", function (e) {
            navLinks.forEach(item => item.classList.remove("active"));
            this.classList.add("active");
            updateRecentTabs(this);
        });
    });
</script>

</body>
</html>
