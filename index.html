<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>鑑識工具箱</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        height: 100%;
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background: #f3f5f7;
    }

    body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ===== 上方標頭 ===== */
    #navbar {
        min-height: 64px;
        padding: 10px 18px;

        display: flex;
        align-items: center;
        gap: 8px;

        background: #263746;
        border-bottom: 1px solid #182631;

        overflow-x: auto;
        white-space: nowrap;
    }

    /* 系統名稱 */
    .navbar-title {
        display: flex;
        align-items: center;
        gap: 8px;

        margin-right: 12px;
        padding-right: 18px;

        color: white;
        font-size: 18px;
        font-weight: 700;

        border-right: 1px solid rgba(255,255,255,.25);
        flex-shrink: 0;
    }

    .navbar-title .icon {
        font-size: 22px;
    }

    /* 功能按鈕 */
    #navbar a {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        height: 38px;
        padding: 0 14px;

        color: #e8eef3;
        text-decoration: none;

        font-size: 14px;
        font-weight: 500;

        border-radius: 7px;

        transition:
            background-color .15s ease,
            color .15s ease,
            transform .15s ease;
    }

    /* 滑鼠移入 */
    #navbar a:hover {
        background: rgba(255,255,255,.14);
        color: #ffffff;
    }

    /* 點選中的功能 */
    #navbar a.active {
        background: #ffffff;
        color: #263746;
        font-weight: 700;
        box-shadow: 0 2px 6px rgba(0,0,0,.18);
    }

    /* iframe */
    #content-frame {
        flex: 1;
        width: 100%;
        border: none;
        background: white;
    }

    /* scrollbar */
    #navbar::-webkit-scrollbar {
        height: 5px;
    }

    #navbar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.25);
        border-radius: 10px;
    }
</style>
</head>


<body>

<div id="navbar">

    <div class="navbar-title">
        <span class="icon">🧰</span>
        <span>鑑識工具箱</span>
    </div>

    <a href="duty/equipment.html"
       target="contentFrame"
       class="active">
        裝備檢查
    </a>

    <a href="contacts/phonebook.html"
       target="contentFrame">
        分機查詢
    </a>

    <a href="LABELPRINT/labelprint.html"
       target="contentFrame">
        標籤列印
    </a>

    <a href="timeline_pic_v12.html"
       target="contentFrame">
        時間線
    </a>

    <a href="ramanspec_compare_v2.html"
       target="contentFrame">
        光譜標記
    </a>

    <a href="card_mindmap_timeline_style.html"
       target="contentFrame">
        心智圖
    </a>

    <a href="pdf_to_image.html"
       target="contentFrame">
        PDF轉JPG
    </a>

    <a href="image_to_pdf.html"
       target="contentFrame">
        JPG彙整為PDF
    </a>

    <a href="pdf_to_ppt_v4.html"
       target="contentFrame">
        PDF回復PPT/PNG
    </a>
    <a href="batch_cropper.html"
       target="contentFrame">
        批次圖片手動剪裁
    </a>
</div>
<iframe
    id="content-frame"
    name="contentFrame"
    src="duty/equipment.html">
</iframe>
<script>
    const navLinks = document.querySelectorAll("#navbar a");

    navLinks.forEach(link => {
        link.addEventListener("click", function () {

            navLinks.forEach(item => {
                item.classList.remove("active");
            });

            this.classList.add("active");
        });
    });
</script>

</body>
</html>
